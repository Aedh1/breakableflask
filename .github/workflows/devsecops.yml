name: Automatisation des tests DevSecOps

on: push

jobs:

  Dependances:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v3

      - name: Vérification des dépendances (Trivy)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/project \
            -v $HOME/.cache/trivy:/root/.cache/ \
            aquasec/trivy:latest fs /project/requirements.txt

  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - name: Récupération du code
        uses: actions/checkout@v3

      - name: Scan de sécurité Dockerfile (hadolint)
        run: |
          sudo apt-get update
          sudo apt-get install -y hadolint
          hadolint Dockerfile

  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: |
          echo "Application prête à être déployée ✔️"
